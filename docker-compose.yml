# ============================================
# Countdown - count.himmelreich.cloud
# Traefik + Cloudflare Tunnel
# ============================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: countdown-app
    container_name: countdown
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.countdown.rule=Host(`count.himmelreich.cloud`)"
      - "traefik.http.routers.countdown.entrypoints=web"
      - "traefik.http.services.countdown.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      start_period: 10s
      timeout: 5s
      retries: 3

networks:
  proxy:
    external: true
