server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # index.html nie cachen, damit neue Builds sofort greifen
    location = /index.html {
        expires -1;
    }

    # Kein add_header in den Locations, sonst entfallen die Security-Header oben
    # Statische Assets (Dateinamen mit Hash) lange cachen
    location /static/ {
        expires 1y;
    }

    # React SPA: alle Routen auf index.html umleiten
    location / {
        try_files $uri $uri/ /index.html;
    }
}
